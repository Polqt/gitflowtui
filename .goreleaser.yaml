project_name: gitflow-tui

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: gitflow-tui
    main: ./cmd/gitflow-tui
    binary: gitflow-tui
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.buildVersion={{.Version}}
      - -X main.buildCommit={{.Commit}}
      - -X main.buildDate={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{.Tag}}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore\\(deps\\):"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: Polqt
    name: gitflowtui
  draft: false
  prerelease: auto
